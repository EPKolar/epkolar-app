# nginx-Vorlage Kamera-Proxy (EPKolar Kameras Phase 2) - Alternative zu Caddy. Platzhalter <...> vor Ort ersetzen.
# Pruefer-Umgebung dazu: KAMERA_AUTH_URI_HEADER=x-original-uri  KAMERA_AUTH_METHOD_HEADER=x-original-method
#
# KOPFZEILEN-REGEL: der Pruefer vertraut NUR X-Original-URI / X-Original-Method. nginx reicht Client-Koepfe an die
# auth_request-Unteranfrage durch -> hier werden beide vertrauenswuerdigen Koepfe aus nginx-Variablen UEBERSCHRIEBEN
# und die Client-Kopien X-Forwarded-Uri / X-Forwarded-Method geleert (leerer Wert = nginx sendet den Kopf nicht).
# Kaeme trotzdem einer an, antwortet der Pruefer 403.
#
# PFAD-REGEL: der Pruefer sieht $request_uri (roh), nginx leitet nach $uri (dekodiert, normalisiert) weiter.
# Beides ist nur dann gleich, wenn der rohe Pfad kein %, kein .. und kein // enthaelt - genau das weist der Pruefer
# mit 403 ab (verify.mjs pfadArt). Streamname nur [A-Za-z0-9_-]{1,64}, gross/klein exakt.

upstream kamera_auth { server kamera-auth:9099; }
upstream go2rtc      { server go2rtc:1984; }

log_format kamera_ohne_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen <VIDEOHOST_LAN_IP>:443 ssl;
    http2 on;
    server_name <KAMERA_DOMAIN>;

    ssl_certificate     /zertifikate/kamera.crt;
    ssl_certificate_key /zertifikate/kamera.key;

    # Kopfzeilen mit Unterstrich verwerfen (Standard, hier ausdruecklich): kein X_Original_URI-Schmuggel
    underscores_in_headers off;
    ignore_invalid_headers on;
    merge_slashes on;

    access_log /var/log/nginx/kamera.log kamera_ohne_query;   # nie $request_uri / $args (Tokens)
    server_tokens off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /_kamera_pruefen {
        internal;
        proxy_pass              http://kamera_auth/pruefen;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        # vertrauenswuerdiges Paar: von nginx gesetzt (ueberschreibt jede Client-Kopie)
        proxy_set_header        X-Original-URI     $request_uri;
        proxy_set_header        X-Original-Method  $request_method;
        # Client-Kopien des anderen Paares entfernen
        proxy_set_header        X-Forwarded-Uri    "";
        proxy_set_header        X-Forwarded-Method "";
    }

    # CORS-Vorabanfrage fuer WHEP
    location ~ ^/live/[A-Za-z0-9_-]{1,64}/whep$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://epkolar.github.io";
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "content-type";
            add_header Access-Control-Allow-Private-Network "true";
            add_header Access-Control-Max-Age 600;
            return 204;
        }
        auth_request /_kamera_pruefen;
        include /etc/nginx/kamera_upstream_koepfe.conf;
        add_header Access-Control-Allow-Origin "https://epkolar.github.io" always;
        add_header Access-Control-Expose-Headers "Location" always;
        rewrite ^/live/([A-Za-z0-9_-]{1,64})/whep$ /api/webrtc?src=$1 break;
        proxy_pass http://go2rtc;
    }

    location ~ ^/live/([A-Za-z0-9_-]{1,64})/mjpeg$ {
        auth_request /_kamera_pruefen;
        include /etc/nginx/kamera_upstream_koepfe.conf;
        proxy_buffering off;
        rewrite ^/live/([A-Za-z0-9_-]{1,64})/mjpeg$ /api/stream.mjpeg?src=$1 break;
        proxy_pass http://go2rtc;
    }

    location ~ ^/live/([A-Za-z0-9_-]{1,64})/snapshot\.jpg$ {
        auth_request /_kamera_pruefen;
        include /etc/nginx/kamera_upstream_koepfe.conf;
        rewrite ^/live/([A-Za-z0-9_-]{1,64})/snapshot\.jpg$ /api/frame.jpeg?src=$1 break;
        proxy_pass http://go2rtc;
    }

    # HLS/Aufzeichnung: im Pilot aus (siehe tools/kamera-proxy-auth/README.md)

    # Gesundheitsabruf fuer die App-Ansicht "Einrichtung": nur "ok", kein Bild, kein go2rtc
    location = /gesund {
        add_header Access-Control-Allow-Origin "https://epkolar.github.io" always;
        add_header Access-Control-Allow-Private-Network "true" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok";
    }

    location / { return 404; }
}

# Inhalt von /etc/nginx/kamera_upstream_koepfe.conf (auch zu go2rtc keine Client-Kopien weiterreichen):
#   proxy_set_header X-Original-URI     "";
#   proxy_set_header X-Original-Method  "";
#   proxy_set_header X-Forwarded-Uri    "";
#   proxy_set_header X-Forwarded-Method "";
#   proxy_set_header X-Kamera-Token     "";
#   proxy_set_header Authorization      "";
